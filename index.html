<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Piškvorky proti UI</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --panel2:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#38bdf8;
      --accent2:#22c55e;
      --danger:#fb7185;
      --cell:#020617;
      --line:#334155;
      --shadow:0 18px 45px rgba(0,0,0,.35);
      --radius:22px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.20), transparent 34%),
        radial-gradient(circle at bottom right, rgba(34,197,94,.16), transparent 30%),
        var(--bg);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }

    .app{
      width:100%;
      max-width:460px;
      background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(15,23,42,.96));
      border:1px solid rgba(148,163,184,.18);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    header{
      padding:22px 20px 14px;
      text-align:center;
      border-bottom:1px solid rgba(148,163,184,.14);
    }

    h1{
      margin:0;
      font-size:clamp(28px,7vw,42px);
      letter-spacing:.5px;
    }

    .sub{
      color:var(--muted);
      margin-top:6px;
      font-size:14px;
    }

    main{
      padding:18px;
    }

    .score{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:16px;
    }

    .score-card{
      background:rgba(31,41,55,.76);
      border:1px solid rgba(148,163,184,.14);
      border-radius:16px;
      padding:12px 8px;
      text-align:center;
    }

    .score-card span{
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-bottom:4px;
    }

    .score-card strong{
      font-size:24px;
    }

    .status{
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:rgba(2,6,23,.48);
      border:1px solid rgba(148,163,184,.14);
      border-radius:16px;
      padding:10px;
      margin-bottom:16px;
      font-weight:700;
    }

    .board{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin:0 auto 16px;
      max-width:390px;
    }

    .cell{
      aspect-ratio:1/1;
      border:none;
      border-radius:20px;
      background:
        linear-gradient(145deg,rgba(30,41,59,.96),rgba(2,6,23,.98));
      color:var(--text);
      font-size:clamp(46px,16vw,76px);
      font-weight:900;
      cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(148,163,184,.14), 0 8px 18px rgba(0,0,0,.24);
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .cell:hover{
      transform:translateY(-2px);
      box-shadow:inset 0 0 0 1px rgba(56,189,248,.35), 0 12px 24px rgba(0,0,0,.34);
    }

    .cell:disabled{
      cursor:not-allowed;
      opacity:.92;
    }

    .cell.x{
      color:var(--accent);
      text-shadow:0 0 18px rgba(56,189,248,.35);
    }

    .cell.o{
      color:var(--accent2);
      text-shadow:0 0 18px rgba(34,197,94,.30);
    }

    .cell.win{
      background:linear-gradient(145deg,rgba(56,189,248,.28),rgba(34,197,94,.22));
      box-shadow:inset 0 0 0 2px rgba(56,189,248,.65), 0 0 22px rgba(56,189,248,.22);
    }

    .controls{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    button.action{
      border:none;
      border-radius:15px;
      padding:13px 10px;
      font-weight:800;
      color:#07111f;
      background:var(--accent);
      cursor:pointer;
      font-size:15px;
    }

    button.secondary{
      background:#e5e7eb;
    }

    .hint{
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      text-align:center;
      margin-top:14px;
    }

    @media (max-width:380px){
      main{padding:14px}
      .board{gap:8px}
      .cell{border-radius:16px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Piškvorky</h1>
      <div class="sub">Hraješ za X proti počítači O</div>
    </header>

    <main>
      <section class="score">
        <div class="score-card">
          <span>Ty</span>
          <strong id="playerScore">0</strong>
        </div>
        <div class="score-card">
          <span>Remízy</span>
          <strong id="drawScore">0</strong>
        </div>
        <div class="score-card">
          <span>UI</span>
          <strong id="aiScore">0</strong>
        </div>
      </section>

      <div class="status" id="status">Jsi na tahu.</div>

      <section class="board" id="board">
        <button class="cell" data-i="0"></button>
        <button class="cell" data-i="1"></button>
        <button class="cell" data-i="2"></button>
        <button class="cell" data-i="3"></button>
        <button class="cell" data-i="4"></button>
        <button class="cell" data-i="5"></button>
        <button class="cell" data-i="6"></button>
        <button class="cell" data-i="7"></button>
        <button class="cell" data-i="8"></button>
      </section>

      <section class="controls">
        <button class="action" id="newRoundBtn">Nové kolo</button>
        <button class="action secondary" id="resetScoreBtn">Vynulovat skóre</button>
      </section>

      <div class="hint">
        Počítač se snaží vyhrát, blokovat tvoji výhru a brát nejlepší pole.
      </div>
    </main>
  </div>

  <script>
    const cells = Array.from(document.querySelectorAll(".cell"));
    const statusEl = document.getElementById("status");
    const playerScoreEl = document.getElementById("playerScore");
    const drawScoreEl = document.getElementById("drawScore");
    const aiScoreEl = document.getElementById("aiScore");
    const newRoundBtn = document.getElementById("newRoundBtn");
    const resetScoreBtn = document.getElementById("resetScoreBtn");

    const PLAYER = "X";
    const AI = "O";

    const winLines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill("");
    let gameOver = false;
    let playerScore = Number(localStorage.getItem("tttPlayerScore") || 0);
    let drawScore = Number(localStorage.getItem("tttDrawScore") || 0);
    let aiScore = Number(localStorage.getItem("tttAiScore") || 0);

    updateScore();

    cells.forEach(cell => {
      cell.addEventListener("click", () => {
        const index = Number(cell.dataset.i);
        playerMove(index);
      });
    });

    newRoundBtn.addEventListener("click", newRound);

    resetScoreBtn.addEventListener("click", () => {
      playerScore = 0;
      drawScore = 0;
      aiScore = 0;
      saveScore();
      updateScore();
      newRound();
    });

    function playerMove(index){
      if(gameOver || board[index]) return;

      placeMark(index, PLAYER);
      const result = checkGame();

      if(result) {
        finishGame(result);
        return;
      }

      statusEl.textContent = "UI přemýšlí...";
      setBoardDisabled(true);

      setTimeout(() => {
        aiMove();
        const aiResult = checkGame();

        if(aiResult){
          finishGame(aiResult);
        } else {
          statusEl.textContent = "Jsi na tahu.";
          setBoardDisabled(false);
        }
      }, 350);
    }

    function aiMove(){
      const move =
        findWinningMove(AI) ??
        findWinningMove(PLAYER) ??
        takeCenter() ??
        takeOppositeCorner() ??
        takeCorner() ??
        takeSide();

      if(move !== null && move !== undefined){
        placeMark(move, AI);
      }
    }

    function findWinningMove(mark){
      for(const line of winLines){
        const values = line.map(i => board[i]);
        const markCount = values.filter(v => v === mark).length;
        const emptyCount = values.filter(v => v === "").length;

        if(markCount === 2 && emptyCount === 1){
          return line[values.indexOf("")];
        }
      }
      return null;
    }

    function takeCenter(){
      return board[4] === "" ? 4 : null;
    }

    function takeOppositeCorner(){
      const pairs = [[0,8],[2,6]];
      for(const [a,b] of pairs){
        if(board[a] === PLAYER && board[b] === "") return b;
        if(board[b] === PLAYER && board[a] === "") return a;
      }
      return null;
    }

    function takeCorner(){
      const corners = [0,2,6,8].filter(i => board[i] === "");
      return corners.length ? randomFrom(corners) : null;
    }

    function takeSide(){
      const sides = [1,3,5,7].filter(i => board[i] === "");
      return sides.length ? randomFrom(sides) : null;
    }

    function randomFrom(arr){
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function placeMark(index, mark){
      board[index] = mark;
      cells[index].textContent = mark;
      cells[index].classList.add(mark === PLAYER ? "x" : "o");
    }

    function checkGame(){
      for(const line of winLines){
        const [a,b,c] = line;
        if(board[a] && board[a] === board[b] && board[a] === board[c]){
          return { winner: board[a], line };
        }
      }

      if(board.every(Boolean)){
        return { winner: "draw", line: [] };
      }

      return null;
    }

    function finishGame(result){
      gameOver = true;
      setBoardDisabled(true);

      if(result.line.length){
        result.line.forEach(i => cells[i].classList.add("win"));
      }

      if(result.winner === PLAYER){
        playerScore++;
        statusEl.textContent = "Vyhrál jsi!";
      } else if(result.winner === AI){
        aiScore++;
        statusEl.textContent = "Vyhrála UI.";
      } else {
        drawScore++;
        statusEl.textContent = "Remíza.";
      }

      saveScore();
      updateScore();
    }

    function setBoardDisabled(disabled){
      cells.forEach((cell, i) => {
        cell.disabled = disabled || Boolean(board[i]) || gameOver;
      });
    }

    function newRound(){
      board = Array(9).fill("");
      gameOver = false;
      cells.forEach(cell => {
        cell.textContent = "";
        cell.className = "cell";
        cell.disabled = false;
      });
      statusEl.textContent = "Jsi na tahu.";
    }

    function updateScore(){
      playerScoreEl.textContent = playerScore;
      drawScoreEl.textContent = drawScore;
      aiScoreEl.textContent = aiScore;
    }

    function saveScore(){
      localStorage.setItem("tttPlayerScore", playerScore);
      localStorage.setItem("tttDrawScore", drawScore);
      localStorage.setItem("tttAiScore", aiScore);
    }
  </script>
</body>
</html>
